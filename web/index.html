<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Att göra</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header>
    <textarea id="new-title" rows="1" placeholder="Ny uppgift" autocomplete="off" spellcheck="false"></textarea>
    <div class="filter-row">
      <div class="segmented">
        <button data-filter="all">Alla</button>
        <button data-filter="active">Kvar</button>
        <button data-filter="done">Klara</button>
      </div>
      <button id="add" class="btn">Lägg till</button>
    </div>
  </header>
  <div class="rule"></div>
  <main>
    <div id="list"></div>
    <div id="empty" hidden></div>
  </main>
  <div class="rule"></div>
  <footer>
    <span id="remaining"></span>
    <span class="spacer"></span>
    <button id="smaller" class="btn icon" title="Mindre text (⌘−)"></button>
    <button id="bigger" class="btn icon" title="Större text (⌘+)"></button>
    <span class="spacer"></span>
    <button id="sync" class="btn icon"></button>
    <button id="clear-done" class="btn">Rensa klara</button>
  </footer>
  <script src="native.js"></script>
  <script src="store.js"></script>
  <script src="sync.js"></script>
  <script src="syncview.js"></script>
  <script src="alarm.js"></script>
  <script src="app.js"></script>
</body>
</html>
